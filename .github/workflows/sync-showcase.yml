name: Sync Showcase Catalog

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync catalog from ahanow.ai/llms-full.txt
        run: node scripts/sync-showcase.mjs

      - name: Commit updated catalog
        run: |
          if git diff --quiet README.md data/catalog.json; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/catalog.json
          git commit -m "chore(catalog): sync showcase entries from ahanow.ai"
          git push
